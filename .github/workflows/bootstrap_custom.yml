# ============================================================================
# 从源码编译「重定向包名」的 Termux bootstrap
#
# 支持一次构建多个包名（本项目需要两个变体）：
#   me.sources.ai        → perf / release
#   me.sources.ai.debug  → debug
#
# 为什么要自己编而不能用官方 generate-bootstraps.sh：
#   那个脚本（bootstrap_archives.yml 每周跑的那个）只是从 apt 仓库下载现成 .deb
#   再手工拼 dpkg/status。.deb 里的 ELF 在 Termux 官方编译时已经把
#   /data/data/com.termux 写进 .rodata，事后改 properties.sh 只能改它拼目录时用的
#   $TERMUX_PREFIX，改不了二进制字节。结果就是「目录是新包名，bash 找不到自己的库」。
#
# 所以必须走 build-bootstraps.sh（从源码编译）。官方自己的 --help 就写明：
#   "The package name/prefix that the bootstrap is built for is defined by
#    TERMUX_APP_PACKAGE in 'scrips/properties.sh'. It defaults to 'com.termux'.
#    If package name is changed, make sure to run
#    ./scripts/run-docker.sh ./clean.sh' or pass '-f' to force rebuild of packages."
#   —— 改包名后必须 -f 强制重编，否则吃缓存里的旧 .deb。
# ============================================================================

name: Bootstrap (compile from source, custom package name)

on:
  workflow_dispatch:
    inputs:
      package_names:
        # 必须是合法 JSON 数组字符串。用数组而不是逗号分隔，是因为
        # GitHub 的表达式语言没有 split()，逗号串只能靠 fromJSON(format(...))
        # 拼出来，引号转义极易出错（实测会退化成单个元素，矩阵不展开）。
        description: '目标 applicationId 的 JSON 数组'
        required: true
        default: '["me.sources.ai","me.sources.ai.debug"]'
      arch:
        description: '架构'
        type: choice
        required: true
        default: aarch64
        options: [aarch64, arm, x86_64, i686]
      extra_packages:
        description: '额外包，逗号分隔（例：java-21-openjdk,python,nodejs,git）'
        required: false
        default: ''
      android10:
        description: '生成 Android 10+ 兼容格式（--android10）'
        type: boolean
        required: false
        default: false
      build_images:
        description: '每次重建 builder 镜像（首次或 scripts/ 变更时建议 true）'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      # 两个包名并行，各自独立跑（互不干扰，因为改的是 properties.sh，
      # 每个 matrix 实例都是全新 checkout + 独立容器）
      fail-fast: false
      matrix:
        # 把逗号分隔的包名列表转成 JSON 数组。
        # 用 split 后直接拼 JSON：不依赖 format 的引号转义，
        # 带点号的包名（me.sources.ai.debug）也能正确解析。
        pkg: ${{ fromJSON(inputs.package_names) }}

    steps:
      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: tp
          fetch-depth: 1

      # 官方 docker_image.yml 的做法就是本地 docker build（不是拉 ghcr）：
      #   docker build --tag termux/package-builder:latest scripts/
      # 镜像里含 Android SDK / NDK / toolchain，必须与当前 checkout 的 scripts/
      # 版本匹配。拉过期镜像会让 setup 脚本和工具链对不上，报错难定位。
      # ------------------------------------------------------------------
      # 镜像源自动测速
      #
      # 编译期间会大量拉取源码 tarball（每个包的 build.sh 里写了 URL）。
      # 官方默认走 github.com / 上游站点，国内 runner 或出口受限时会大量超时，
      # 表现为「某个包一直卡在 download」或 checksum 失败。
      #
      # 这里做两件事：
      #   1. 对几个常用 GitHub 镜像测速，选出最快的一个写入 git 全局配置，
      #      并把 github.com 的 URL 替换规则交给 git 的 insteadOf —— 这样
      #      packages/ 里那些写死 https://github.com/... 的 build.sh 不用改。
      #   2. 同时测 apt 源，把 runner 的 Ubuntu 源换成最快的镜像，避免
      #      docker build 阶段 apt-get 卡住。
      # ------------------------------------------------------------------
      - name: Probe mirrors and configure
        run: |
          set -uo pipefail

          probe() {  # probe <name> <url>
            local name="$1" url="$2" t
            t=$(curl -o /dev/null -s -w '%{time_total}' --max-time 6 --connect-timeout 4 "$url" 2>/dev/null || echo 999)
            printf '%-22s %ss
' "$name" "$t"
            printf '%s %s
' "$t" "$name:$url"
          }

          echo '--- GitHub 镜像测速 ---'
          {
            probe 'github.com(直连)'  'https://github.com/termux/termux-packages/raw/master/README.md'
            probe 'ghproxy.net'       'https://ghproxy.net/https://github.com/termux/termux-packages/raw/master/README.md'
            probe 'gh-proxy.com'      'https://gh-proxy.com/https://github.com/termux/termux-packages/raw/master/README.md'
            probe 'ghfast.top'        'https://ghfast.top/https://github.com/termux/termux-packages/raw/master/README.md'
            probe 'kkgithub'          'https://raw.kkgithub.com/termux/termux-packages/master/README.md'
          } > /tmp/mirror-probe.txt 2>&1
          cat /tmp/mirror-probe.txt

          # 取耗时最小的一行（按第一列数值排序）
          best=$(grep -E '^[0-9]' /tmp/mirror-probe.txt | sort -n | head -1 | cut -d' ' -f2-)
          echo "BEST_GITHUB=$best"

          case "$best" in
            *'(直连)'*)
              echo '::notice::GitHub 直连最快，不配置镜像'
              ;;
            'ghproxy.net:'*)
              git config --global url."https://ghproxy.net/https://github.com/".insteadOf "https://github.com/"
              echo '::notice::使用 ghproxy.net'
              ;;
            'gh-proxy.com:'*)
              git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
              echo '::notice::使用 gh-proxy.com'
              ;;
            'ghfast.top:'*)
              git config --global url."https://ghfast.top/https://github.com/".insteadOf "https://github.com/"
              echo '::notice::使用 ghfast.top'
              ;;
            *)
              echo '::notice::镜像未命中明确分支，回退直连'
              ;;
          esac
          git config --global --get-regexp 'url\.' || echo '(no insteadOf configured)'

          echo '--- apt 源测速 ---'
          for m in \
            'https://mirrors.tuna.tsinghua.edu.cn/ubuntu/' \
            'https://mirrors.aliyun.com/ubuntu/' \
            'https://mirrors.ustc.edu.cn/ubuntu/' \
            'http://archive.ubuntu.com/ubuntu/' \
          ; do
            t=$(curl -o /dev/null -s -w '%{time_total}' --max-time 6 --connect-timeout 4 "${m}dists/noble/Release" 2>/dev/null || echo 999)
            printf '%-55s %ss
' "$m" "$t"
            printf '%s %s
' "$t" "$m"
          done > /tmp/apt-probe.txt 2>&1
          cat /tmp/apt-probe.txt

          bestapt=$(grep -E '^[0-9]' /tmp/apt-probe.txt | sort -n | head -1 | cut -d' ' -f2-)
          echo "BEST_APT=$bestapt"
          # builder 镜像内部才跑 apt-get，宿主源影响有限，这里只记录不强制替换，
          # 避免改坏 runner 环境导致 docker build 失败。
          echo "APT_MIRROR=$bestapt" >> "$GITHUB_ENV"

      - name: Build builder image
        if: ${{ inputs.build_images }}
        working-directory: tp
        run: |
          set -euo pipefail
          docker build --tag termux/package-builder:latest scripts/
          docker image inspect termux/package-builder:latest --format '{{.Id}} {{.Size}}'

      - name: Pull builder image
        if: ${{ !inputs.build_images }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/termux/package-builder:latest
          docker tag ghcr.io/termux/package-builder:latest termux/package-builder:latest

      # ------------------------------------------------------------------
      # 重定向包名：只改 properties.sh 的 TERMUX_APP__PACKAGE_NAME（第 467 行）。
      # DATA_DIR / ROOTFS / PREFIX / HOME 全部由它派生（第 488 / 786 / 837 / 947 行）：
      #   TERMUX_APP__DATA_DIR="/data/data/$TERMUX_APP__PACKAGE_NAME"
      #   TERMUX__ROOTFS="$TERMUX_APP__DATA_DIR/files"
      #   TERMUX__HOME="$TERMUX__ROOTFS/home"
      #   TERMUX__PREFIX="$TERMUX__ROOTFS/usr"
      # 编译时新路径会被写进每个 ELF，这正是我们要的。
      # ------------------------------------------------------------------
      - name: Retarget package name
        working-directory: tp
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail

          # 1) 包名正则：与 properties.sh 里 TERMUX_REGEX__APP_PACKAGE_NAME 保持一致
          if ! printf '%s' "$PKG" | grep -qE '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'; then
            echo "::error::package_name 不符合 Termux 包名正则: $PKG"
            exit 1
          fi

          # 2) 断言：变量定义必须恰好 1 处，防止上游改了结构后我们静默改错地方
          cnt=$(grep -cE '^TERMUX_APP__PACKAGE_NAME="com\.termux"$' scripts/properties.sh || true)
          if [ "$cnt" != "1" ]; then
            echo "::error::properties.sh 中 TERMUX_APP__PACKAGE_NAME 定义 $cnt 处（期望 1）。上游可能改了结构，需人工核对："
            grep -n 'TERMUX_APP__PACKAGE_NAME' scripts/properties.sh || true
            exit 1
          fi

          # 3) 替换
          sed -i "s|^TERMUX_APP__PACKAGE_NAME=\"com\\.termux\"$|TERMUX_APP__PACKAGE_NAME=\"$PKG\"|" scripts/properties.sh

          # 4) 验证替换 + 打印派生路径
          echo '--- properties.sh ---'
          grep -n 'TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
          echo '--- 派生路径自检 ---'
          bash -c '
            set -eu
            . ./scripts/properties.sh
            printf "APP_PACKAGE : %s\n" "$TERMUX_APP__PACKAGE_NAME"
            printf "DATA_DIR    : %s\n" "$TERMUX_APP__DATA_DIR"
            printf "ROOTFS      : %s\n" "$TERMUX__ROOTFS"
            printf "PREFIX      : %s\n" "$TERMUX__PREFIX"
            printf "HOME        : %s\n" "$TERMUX__HOME"
            test "$TERMUX_APP__DATA_DIR" = "/data/data/$TERMUX_APP__PACKAGE_NAME"
            test "$TERMUX__PREFIX" = "/data/data/$TERMUX_APP__PACKAGE_NAME/files/usr"
            printf "OK: 派生链正确\n"
          '

          echo '--- 各包定义中硬编码 com.termux 的文件（仅提示）---'
          grep -rln 'com\.termux' packages/ 2>/dev/null | head -20 || echo '(none)'

      # build-bootstraps.sh 的 --help 明确要求：改了包名必须 clean 或 -f。
      # 两个都做，双保险 —— 只要漏一个，就会拿缓存里包名还是 com.termux
      # 的旧 .deb 去拼 rootfs，白编一趟。
      - name: Clean previous builds
        working-directory: tp
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./clean.sh || true
          rm -rf "$HOME/.termux-build" || true

      - name: Build bootstrap from source
        working-directory: tp
        env:
          ARCH: ${{ inputs.arch }}
          EXTRA: ${{ inputs.extra_packages }}
          ANDROID10: ${{ inputs.android10 }}
        run: |
          set -euo pipefail

          args=(--architectures "$ARCH")
          args+=(-f)
          if [ -n "$EXTRA" ]; then
            args+=(--add "$EXTRA")
          fi
          if [ "$ANDROID10" = "true" ]; then
            args+=(--android10)
          fi

          echo "::group::run-docker.sh build-bootstraps.sh ${args[*]}"
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}" 2>&1 | tee /tmp/build-bootstrap.log
          echo '::endgroup::'

          ls -lh ./*.zip

      # ------------------------------------------------------------------
      # 核心验证：ELF 里必须是新包名，不得残留 com.termux
      # ------------------------------------------------------------------
      - name: Verify ELF prefix
        working-directory: tp
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          ZIP=$(ls ./*.zip | head -1)
          echo "artifact: $ZIP"

          probe=/tmp/probe
          rm -rf "$probe"; mkdir -p "$probe"; cd "$probe"
          unzip -q "$GITHUB_WORKSPACE/tp/$ZIP" 'bin/bash' 'bin/sh' 2>/dev/null || \
            unzip -q "$GITHUB_WORKSPACE/tp/$ZIP" 'bin/*' | head

          echo '--- bin/bash 中的 data 路径 ---'
          strings bin/bash | grep -oE '/data/(data|user)/[a-zA-Z0-9_.]+/files(/[a-z]+)?' | sort -u || true

          echo '--- 断言 1：不得残留 com.termux ---'
          if strings bin/bash bin/sh 2>/dev/null | grep -q 'com\.termux'; then
            echo '::error::ELF 仍硬编码 com.termux，说明有包自带 TERMUX_PREFIX 补丁绕过了 properties.sh'
            strings bin/bash bin/sh | grep 'com\.termux' | sort -u | head -20
            exit 1
          fi
          echo 'OK: 无 com.termux 残留'

          echo '--- 断言 2：必须出现新包名前缀 ---'
          if ! strings bin/bash | grep -q "/data/data/$PKG/files/usr"; then
            echo '::error::bin/bash 中找不到 /data/data/'"$PKG"'/files/usr'
            exit 1
          fi
          echo 'OK: 新前缀已写入 ELF'

      - name: Rename artifact
        working-directory: tp
        env:
          PKG: ${{ matrix.pkg }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          for f in ./*.zip; do
            case "$f" in
              *"$ARCH"*) mv "$f" "bootstrap-${ARCH}-${PKG}.zip" ;;
              *)         mv "$f" "bootstrap-${PKG}-$(basename "$f")" ;;
            esac
          done
          ls -lh ./*.zip

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ inputs.arch }}-${{ matrix.pkg }}
          path: tp/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.arch }}-${{ matrix.pkg }}
          path: /tmp/build-bootstrap.log
          if-no-files-found: ignore
          retention-days: 7
