name: Purge old workflow runs

# =============================================================================
# 清理我们自己构建产生的历史 run。
#
# -----------------------------------------------------------------------------
# 它到底要干什么（这次按真实需求写，不再套「通用保留策略」模板）
# -----------------------------------------------------------------------------
#   bootstrap 一次要跑几个小时，失败/取消/跳过都意味着这一轮**白跑**：
#   没有产物、没有价值、只会在 Actions 列表里堆成一片红。这些应当**全部清掉**。
#
#   成功的 run 有 Release 产物作为交付物，历史 run 记录本身没用，
#   只留最近几个用于对照「哪一版构建过」，其余清掉。
#
#   所以策略是：
#     · failure / cancelled / skipped / timed_out / ...  -> 全部删除
#     · success                                          -> 只留最近 keep_success 个
#     · 正在运行 / 排队                                   -> 永不触碰
#
#   早期版本把「失败保留 3 个以便排查」当默认，方向就错了：
#   失败日志已存进 artifact，排查靠那次日志，不是 run 记录本身。
#   保留一堆失败 run 只是把 Actions 页面刷红。
#
# -----------------------------------------------------------------------------
# 只清理我们自己的 workflow
# -----------------------------------------------------------------------------
#   这个 fork 继承了上游大量 workflow（Golang validation、Lint PR、Packages、
#   Zig validation、CodeQL ...）。它们的历史 run 是上游的记录，与本项目无关。
#
#   因此管辖范围反过来定义：**只清理 .github/purge-scope.txt 里列出的 workflow**，
#   不在清单里的一律不碰。想清哪个就在那个文件里加一行，不改本工作流。
#
# -----------------------------------------------------------------------------
# 白名单（可选，用于保住特定 run）
# -----------------------------------------------------------------------------
#   .github/purge-keep-runs.txt 支持 run:<id> 与 workflow:<path>，
#   命中的 run 即使属于被清理的 workflow 也不会删。
#   例如首次完整成功的那次构建想永久留档，就写进去。
#
# -----------------------------------------------------------------------------
# 两个已踩过的实现陷阱，代码里都留了注释
# -----------------------------------------------------------------------------
#   1. GitHub Actions 默认 shell 是 `bash -e {0}`。`set -uo pipefail` 关不掉 -e。
#      所以所有「没匹配到东西也算正常」的解析一律用 awk（无匹配返回 0），
#      不用 grep（无匹配返回 1，会被 -e 直接杀掉）。
#   2. jq 里 `map(select(X) | not)` 的 `not` 在 select 外面，会让 map 得到布尔数组，
#      后续访问对象字段立刻报 "Cannot index boolean"。`not` 必须写在谓词内部。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      keep_success:
        description: "每个 workflow 保留最近几个成功 run（失败/取消/跳过一律全删）"
        required: false
        default: "3"
      dry_run:
        description: "只打印将要删除的列表，不真删"
        required: false
        type: boolean
        default: false
  # 每周一 04:00 UTC 自动清一次
  schedule:
    - cron: '0 4 * * 1'

permissions:
  actions: write   # 删除 run 需要
  contents: read   # 读白名单/范围文件

# 两个 purge 并发可能算出重叠的删除名单，后一个会对已删的 run 发 DELETE
concurrency:
  group: purge-runs
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (读取范围与白名单)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/purge-scope.txt
            .github/purge-keep-runs.txt
          sparse-checkout-cone-mode: false

      - name: Purge runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_SUCCESS: ${{ inputs.keep_success || '3' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SCOPE_FILE: .github/purge-scope.txt
          KEEP_FILE: .github/purge-keep-runs.txt
        run: |
          set -uo pipefail

          echo "repo=$REPO"
          echo "keep_success=$KEEP_SUCCESS dry_run=$DRY_RUN"

          case "$KEEP_SUCCESS" in
            ''|*[!0-9]*) echo "::error::keep_success 必须是整数，收到 '$KEEP_SUCCESS'"; exit 1 ;;
          esac

          # ------------------------------------------------------------------
          # 读管辖范围。这是安全边界：读不到就不干活，绝不默认「全部 workflow」。
          # 用 awk 而非 grep：注释行多、无匹配时不能让 -e 杀掉整个 step。
          # ------------------------------------------------------------------
          if [ ! -f "$SCOPE_FILE" ]; then
            echo "::error::$SCOPE_FILE 不存在。拒绝在没有范围限制的情况下清理仓库。"
            exit 1
          fi
          scope=$(awk '
            { line = $0; sub(/#.*/, "", line); gsub(/[[:space:]]/, "", line) }
            line ~ /^workflow:/ { print substr(line, 10) }
          ' "$SCOPE_FILE" | paste -sd, -)

          if [ -z "$scope" ]; then
            echo "::error::$SCOPE_FILE 里没有任何 workflow: 条目，拒绝执行"
            exit 1
          fi
          SCOPE_JSON=$(printf '%s' "$scope" | jq -R 'split(",")')
          echo "管辖范围: $SCOPE_JSON"

          # ------------------------------------------------------------------
          # 读白名单（可选）
          # ------------------------------------------------------------------
          KEEP_IDS='[]'
          if [ -f "$KEEP_FILE" ]; then
            ids=$(awk '
              { line = $0; sub(/#.*/, "", line); gsub(/[[:space:]]/, "", line) }
              line ~ /^run:[0-9]+$/ { print substr(line, 5) }
            ' "$KEEP_FILE" | paste -sd, -)
            if [ -n "$ids" ]; then
              KEEP_IDS=$(printf '%s' "$ids" | jq -R 'split(",") | map(tonumber)')
            fi
          fi
          echo "白名单 run id: $KEEP_IDS"

          # ------------------------------------------------------------------
          # 翻页抓取 + 按 id 去重
          #
          # 不去重的话，翻页期间新 run 产生会让后面页整体位移，
          # 同一个 run 出现在两页 -> 被删两次 -> 第二次 404。
          # ------------------------------------------------------------------
          tmp=$(mktemp); raw=$(mktemp)
          echo '[]' > "$tmp"
          page=1
          while :; do
            if ! batch=$(gh api "/repos/$REPO/actions/runs?per_page=100&page=$page" \
                           --jq '[.workflow_runs[] | {id, workflow_id, status, conclusion, created_at, path}]' 2>"${raw}.err"); then
              err=$(head -3 "${raw}.err" 2>/dev/null || true)
              echo "::error::第 $page 页抓取失败（限流或鉴权）：$err"
              exit 1
            fi
            n=$(printf '%s' "$batch" | jq 'length')
            echo "page $page -> $n runs"
            [ "$n" -eq 0 ] && break
            printf '%s' "$batch" > "$raw"
            if ! jq -s '.[0] + .[1] | unique_by(.id)' "$tmp" "$raw" > "$tmp.new"; then
              echo "::error::第 $page 页合并失败"
              exit 1
            fi
            mv "$tmp.new" "$tmp"
            page=$((page+1))
            [ "$page" -gt 50 ] && { echo "::error::页数超上限"; exit 1; }
          done

          total=$(jq 'length' "$tmp")
          echo "total runs fetched (deduped): $total"

          # ------------------------------------------------------------------
          # 计算删除名单
          #
          # 过滤顺序（任一不满足就不进候选）：
          #   1. status == "completed"     正在跑/排队的一律不碰
          #   2. path 在管辖范围内          上游 workflow 一个都不动
          #   3. id 不在白名单
          #
          # 然后分两组：
          #   ok   成功  -> 保留最近 keep_success 个，其余删
          #   bad  其余  -> 全删（失败/取消/跳过都是白跑一轮，没有保留价值）
          # ------------------------------------------------------------------
          to_delete=$(jq -r \
            --argjson ks "$KEEP_SUCCESS" \
            --argjson keep_ids "$KEEP_IDS" \
            --argjson scope "$SCOPE_JSON" '
            [ .[]
              | select(.status == "completed")
              | select(.path as $p | any($scope[]; . == $p))
              | select(.id as $i | (any($keep_ids[]; . == $i) | not))
            ]
            | group_by(.workflow_id)
            | map(
                . as $all
                | ( [ $all[] | select(.conclusion == "success") ]
                    | sort_by(.created_at) | reverse ) as $ok
                | ( [ $all[] | select(.conclusion != "success") ]
                    | sort_by(.created_at) | reverse ) as $bad
                | ( ($ok | .[$ks:]) + $bad )
              )
            | add // []
            | .[]
            | "\(.id)\t\(.conclusion // "-")\t\(.created_at)\t\(.path)"
          ' "$tmp")

          # 范围外的东西一律不动，这里回显一下让日志能自证
          skipped_scope=$(jq -r --argjson scope "$SCOPE_JSON" '
            [ .[] | select(.status == "completed")
              | select(.path as $p | (any($scope[]; . == $p) | not)) ]
            | length
          ' "$tmp")
          echo "范围外 run（不处理）: $skipped_scope"

          if [ -z "$to_delete" ]; then
            echo "没有需要删除的 run"
            {
              echo "### Purge 结果"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 管辖 workflow | \`$SCOPE_JSON\` |"
              echo "| 扫描 run 总数 | $total |"
              echo "| 范围外（不动） | $skipped_scope |"
              echo "| 待删除 | 0 |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cnt=$(printf '%s\n' "$to_delete" | grep -c . || true)
          echo "---- 待删除 $cnt 个（失败/取消/跳过全删，成功只留最近 $KEEP_SUCCESS 个）----"
          printf '%s\n' "$to_delete"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry_run=true，未实际删除（上面是完整名单）"
            {
              echo "### Purge 结果（dry run）"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 扫描 run 总数 | $total |"
              echo "| 范围外（不动） | $skipped_scope |"
              echo "| 待删除（未执行） | $cnt |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ------------------------------------------------------------------
          # 逐个删除，区分三种结果：
          #   deleted  删掉了
          #   skipped  404 —— 该 run 所属 workflow 文件已被删，永远删不掉，
          #                    不算错误（否则这个 job 会永久刷红）
          #   failed   其他错误（权限/5xx），算错误
          # ------------------------------------------------------------------
          deleted=0; skipped=0; failed=0
          failed_ids=''
          while IFS=$'\t' read -r rid concl created path; do
            [ -z "$rid" ] && continue
            if out=$(gh api -X DELETE "/repos/$REPO/actions/runs/$rid" 2>&1); then
              deleted=$((deleted+1))
            else
              case "$out" in
                *404*|*"Not Found"*)
                  skipped=$((skipped+1))
                  echo "skip(404): $rid ($concl) $path"
                  ;;
                *)
                  failed=$((failed+1))
                  failed_ids="$failed_ids $rid"
                  echo "::warning::delete failed: $rid ($concl) $path -- $(printf '%s' "$out" | head -1)"
                  ;;
              esac
            fi
            sleep 0.15
          done <<< "$to_delete"

          echo "=== 完成: deleted=$deleted skipped(404)=$skipped failed=$failed ==="

          {
            echo "### Purge 结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 管辖 workflow | \`$SCOPE_JSON\` |"
            echo "| 扫描 run 总数 | $total |"
            echo "| 范围外（不动） | $skipped_scope |"
            echo "| 待删除 | $cnt |"
            echo "| 实际删除 | $deleted |"
            echo "| 跳过（404） | $skipped |"
            echo "| 删除失败 | $failed |"
            echo "| 保留策略 | 成功留最近 $KEEP_SUCCESS 个；失败/取消/跳过全删 |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed 个 run 删除失败:$failed_ids"
            exit 1
          fi
          echo PURGE_OK