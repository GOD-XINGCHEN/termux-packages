name: Probe source URLs (runner side)

# 用 GitHub Runner 亲自测试每个源码 URL 能否下载。
#
# 为什么必须在 Runner 上测：本地网络与 Actions 出口差别很大
# （invisible-mirror.net 本地返回 206，Runner 却一直超时）。
# 只有 Runner 的结果才等于构建时真实会遇到的网络情况。
#
# URL 清单放在 .github/source-urls.txt，工作流只负责跑。
# 清单来自失败的 perf 构建日志，每行一个源码下载地址。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/source-urls.txt
          sparse-checkout-cone-mode: false

      - name: Probe all source URLs
        run: |
          set -uo pipefail
          LIST=.github/source-urls.txt
          if [ ! -f "$LIST" ]; then echo "::error::$LIST missing"; exit 1; fi

          total=$(grep -c . "$LIST" || true)
          echo "probing $total urls"

          : > unreachable.txt
          : > report.txt
          ok=0; bad=0

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            # 只取前 512 字节，不下载整个文件
            out=$(curl -sS -o /dev/null \
                    -w '%{http_code} %{time_total}' \
                    --max-time 20 --connect-timeout 10 \
                    -r 0-511 -L "$url" 2>&1) || true
            code=$(printf '%s' "$out" | awk '{print $1}')
            secs=$(printf '%s' "$out" | awk '{print $2}')
            case "$code" in
              200|206|301|302|416)
                ok=$((ok+1))
                printf 'OK   %-5s %-8s %s\n' "$code" "$secs" "$url" >> report.txt
                ;;
              *)
                bad=$((bad+1))
                printf '%s\n' "$url" >> unreachable.txt
                printf 'BAD  %-5s %-8s %s\n' "${code:-ERR}" "${secs:-}" "$url" >> report.txt
                ;;
            esac
          done < "$LIST"

          echo "RESULT: reachable=$ok unreachable=$bad total=$total"
          echo '--- unreachable ---'
          cat unreachable.txt || true

          {
            echo "### Source URL probe (runner side)"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 总计 | $total |"
            echo "| 可达 | $ok |"
            echo "| 不可达 | $bad |"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: |
            report.txt
            unreachable.txt
          if-no-files-found: warn
