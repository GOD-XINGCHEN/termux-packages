name: Bootstrap archives (custom package name, from source)

# =============================================================================
# 目的：从源码编译 Termux bootstrap，把编译期前缀里的包名从 com.termux 换成
#       自己的（debug / perf 各一份）。
#
# 唯一变量：scripts/properties.sh 的 TERMUX_APP__PACKAGE_NAME
#   改这一个常量，下面整条链自动派生（properties.sh 原样逻辑，不动结构）：
#
#     TERMUX_APP__PACKAGE_NAME = me.sources.ai.debug        (L467)
#       TERMUX_APP__DATA_DIR   = /data/data/<pkg>           (L488)
#         TERMUX__ROOTFS       = <DATA_DIR>/files           (L786)
#           TERMUX__PREFIX     = <ROOTFS>/usr               (L947)
#                              = /data/data/me.sources.ai.debug/files/usr
#
#   TERMUX_APP__NAMESPACE 保持 com.termux 不动 —— 它只决定 Shell API 的
#   Intent component 名，不参与任何路径派生，改它反而会让 am/rfcomm 调不到。
#
# 为什么必须 build-bootstraps.sh（真编译），不能用官方 generate-bootstraps.sh：
#   generate-bootstraps.sh 只是从 packages-cf.termux.dev 下载上游【已编译好的】
#   .deb 再重打包。ELF 的 DT_RUNPATH、脚本 shebang 里的 /data/data/com.termux/...
#   都是编译期烧死的常量，改 properties.sh 对这些 .deb 无效。
#   要换前缀必须走 build-package.sh，让 $TERMUX_PREFIX 参与 configure/make。
#
# 产物使用前提：
#   App 侧（Sources-AI-v3 的 TermuxBootstrap.kt / TermuxShell.kt）里写死的
#   prefix 常量必须与这里选的包名一致，否则 bootstrap 找不到自己的 $PREFIX。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "目标架构，逗号分隔（aarch64,arm,i686,x86_64）"
        required: false
        default: "aarch64"
      package_mode:
        description: "构建模式：default=最小默认包集；list=读清单文件（对齐 v3 工具链）；custom=用下面手填的清单"
        required: true
        type: choice
        options:
          - list
          - default
          - custom
        default: list
      add_packages:
        description: "仅 package_mode=custom 时生效。逗号分隔的包名，会完全替代清单文件"
        required: false
        default: ""
      download_retries:
        description: "源码下载总尝试次数（含首次）。默认 6；退避 15/30/60/120/240 秒"
        required: false
        default: "6"
      download_retry_delay:
        description: "下载重试退避基数（秒），每次失败翻倍"
        required: false
        default: "15"
      download_retry_max:
        description: "单次退避上限（秒）"
        required: false
        default: "300"
      force_rebuild:
        description: "强制重编（-f）。**必须保持 true**：换过包名后，旧 deb 缓存里的 ELF 仍烧着 com.termux 前缀，复用会产出「有残留」的坏 bootstrap；增包时依赖 deb 前缀不一致还会让 configure 直接失败"
        required: false
        type: boolean
        default: true

permissions:
  # write 是为了把构建产物发到 Release（比 artifact 好下载、且不会 30 天过期）。
  # 只给 job 级别需要的那一个，不整体提权。
  contents: read

concurrency:
  # 一次 bootstrap 要跑几小时，误触发一次就把前一轮杀掉 = 白烧几小时机器时间。
  # 所以不取消在跑的，改为排队（gh workflow run 连续点也会依次执行）。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # 1. 生成矩阵：flavor（一个包名）× arch（一个架构）
  #    一个 flavor = 一次完整编译。包名清单只改下面 flavors 数组。
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'aarch64' }}
        run: |
          set -euo pipefail

          # ---- 包名定义（与 app/build.gradle.kts 对齐）-----------------------
          #   debug buildType : applicationId = me.sources.ai + ".debug"
          #   perf  buildType : applicationId = me.sources.ai
          flavors='[
            {"id":"debug","package_name":"me.sources.ai.debug"},
            {"id":"perf", "package_name":"me.sources.ai"}
          ]'
          # ------------------------------------------------------------------

          archs="$(printf '%s' "$ARCHITECTURES" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -s -c .)"
          echo "architectures = $archs"

          matrix="$(jq -n -c --argjson f "$flavors" --argjson a "$archs" '{flavor:$f, arch:$a}')"
          echo "matrix = $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. 编译
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.flavor.id }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      # 发 Release 需要 write。两个 matrix 并行跑，各自创建/更新同名 Release
      # 可能撞车，所以用「同一个 tag + 覆盖上传」策略（见 Publish step）。
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          set -x
          docker version
          df -h /

      # -----------------------------------------------------------------------
      # 前置校验：build-bootstraps.sh 里的每个字面量包名都要能解析到源码目录
      #   （该脚本曾写 bzip2 / curl / xz-utils，真实目录是 libbz2 / libcurl / liblzma）
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # 增包前置校验
      #
      # build-bootstraps.sh 的 `--add` 只做 `ADDITIONAL_PACKAGES+=("$pkg")`
      # （L346-352），**不校验包名是否存在**。传一个不存在的名字，要等
      # build_package 循环跑到它才报错 —— 那时前面几十个包已经编完，白等几小时。
      # 这里提前用 repo.json 里的目录清单挡掉。
      # -----------------------------------------------------------------------
      - name: Preflight - add_packages exist
        id: addlist
        # 恒开：清单来自 .github/bootstrap-add-packages.txt；dispatch 的 add_packages
        # 非空时用它覆盖。校验必须放在编译之前 —— 一百多个包名里有一个写错，
        # 等编译跑到一半才发现就是几十分钟白费。
        env:
          ADD_PACKAGES: ${{ inputs.add_packages }}
          PACKAGE_MODE: ${{ inputs.package_mode }}
        run: |
          set -uo pipefail
          mapfile -t repos < <(jq -r 'del(.pkg_format) | keys | .[]' repo.json)
          echo "repos: ${repos[*]}"

          # 和 build 步骤用同一套逻辑取清单，避免两处不一致
          # （之前 preflight 只认 inputs，build 只认 env，两边校验的根本不是同一个集合）
          LIST_FILE=".github/bootstrap-add-packages.txt"
          MODE="${PACKAGE_MODE:-list}"
          echo "package_mode=$MODE"

          case "$MODE" in
            default)
              echo "模式 default：使用 build-bootstraps.sh 自带包集，无增包"
              echo ADD_PACKAGES_OK
              exit 0
              ;;
            custom)
              if [ -z "${ADD_PACKAGES:-}" ]; then
                echo "::error::package_mode=custom 但 add_packages 为空"
                exit 1
              fi
              echo "清单来源: dispatch 输入的 add_packages"
              ;;
            list|*)
              if [ ! -f "$LIST_FILE" ]; then
                echo "::error::package_mode=list 但 $LIST_FILE 不存在"
                exit 1
              fi
              ADD_PACKAGES=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$LIST_FILE" \
                             | grep -v '^$' | awk '!seen[$0]++' | paste -sd, -)
              echo "清单来源: $LIST_FILE"
              ;;
          esac
          n=$(printf '%s' "$ADD_PACKAGES" | tr ',' '\n' | grep -c . || true)
          echo "输入 $n 个包名，开始解析为主包名"

          # ------------------------------------------------------------------
          # 自动修正：子包名 -> 主包名
          #
          # 人写清单时用的是 dpkg 子包名或命令名（clang / xxd / aapt2），
          # 但 --add 只接受主包目录名。这个映射是仓库自带的权威数据：
          # 每个 <root>/<main>/<sub>.subpackage.sh 就定义了 sub -> main。
          # 交给脚本自动做，不再要求人手工改清单。
          #
          # 脚本只做「子包->主包」这种完全可判定的映射；
          # 真正无从判断的（拼写错误）仍然报错，并给出最接近的主包名。
          # ------------------------------------------------------------------
          chmod +x ./scripts/resolve-packages.py 2>/dev/null || true
          if ! resolved=$(./scripts/resolve-packages.py "$ADD_PACKAGES"); then
            echo "::error title=add_packages::有包名无法解析为主包（详见上面的 error 行）"
            echo '提示：--add 只接受主包目录名；子包名会被自动修正，但拼错的名字需要改清单。'
            exit 1
          fi
          ADD_PACKAGES="$resolved"

          n2=$(printf '%s' "$ADD_PACKAGES" | tr ',' '\n' | grep -c . || true)
          echo "解析后 $n2 个主包（去重后）：$ADD_PACKAGES"

          # 二次校验：解析结果必须每个都能落到真实目录
          bad=0
          for pkg in $(printf '%s' "$ADD_PACKAGES" | tr ',' ' '); do
            [ -z "$pkg" ] && continue
            hit=''
            for r in "${repos[@]}"; do
              [ -d "$r/$pkg" ] && { hit="$r"; break; }
            done
            if [ -z "$hit" ]; then
              echo "::error title=add_packages::$pkg 解析后仍不是合法主包（不应发生）"
              bad=1
            else
              printf 'ok  %-24s -> %s\n' "$pkg" "$hit/$pkg"
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

          echo "ADD_PACKAGES=$ADD_PACKAGES" >> "$GITHUB_OUTPUT"
          echo ADD_PACKAGES_OK

      - name: Preflight - package names resolve
        run: |
          set -uo pipefail
          mapfile -t dirs < <(jq -r 'del(.pkg_format) | keys | .[]' repo.json)
          echo "repos: ${dirs[*]}"

          # 只取字面量包名：丢掉 $var / ${var} / "$var" 这类运行时才展开的项
          # （build-bootstraps.sh 里 PACKAGES+=("$add_pkg") 等三处是循环变量，
          #   并非真实包名，早期版本误报为 unresolved）
          mapfile -t pkgs < <(grep -oP 'PACKAGES\+=\("\K[^"]+' scripts/build-bootstraps.sh \
                              | grep -v '\$' | sort -u)
          echo "bootstrap packages (${#pkgs[@]}): ${pkgs[*]}"
          echo

          missing=0
          for p in "${pkgs[@]}"; do
            hit=""
            for d in "${dirs[@]}"; do
              [ -d "$d/$p" ] && { hit="$d"; break; }
            done
            if [ -z "$hit" ]; then
              echo "::error title=unresolved::$p 没有对应源码目录"
              missing=$((missing+1))
            else
              printf 'ok  %-16s -> %s\n' "$p" "$hit/$p"
            fi
          done
          echo "unresolved=$missing / total=${#pkgs[@]}"
          [ "$missing" -eq 0 ]

      # -----------------------------------------------------------------------
      # 前置断言：CI checkout 出来的 build-bootstraps.sh 必须已含 4 处修复。
      # 否则会在几个小时后挂在 bzip2 找不到 / rm -f /*，白跑一轮。
      # 这 4 处若只在本地改了没 commit，CI 看不到 —— 这里就是拦住这种情况。
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # 前置断言：build-bootstraps.sh 必须已含 4 处修复。
      #
      # 这一版按**脚本里的真实写法**校验，不是按我们以为的写法：
      #   · 清理用的是 `rm -f` 而不是 `rm -rf`（之前断言写成 rm -rf，永远不匹配）
      #   · TERMUX_BUILT_PACKAGES_DIRECTORY 是合法存在的变量（第 34 行定义），
      #     真正要防的是 `${VAR:?}` 保护缺失，而不是这个变量名出现
      #
      # 断言仍逐条 print ok/缺什么，失败时能直接看出是第几条没进 commit。
      # -----------------------------------------------------------------------
      - name: Preflight - build-bootstraps.sh fixes present
        run: |
          set -uo pipefail
          f=scripts/build-bootstraps.sh
          bad=0

          # 1) bzip2 -> libbz2（上游已把包目录改名，旧名会让 build-package 找不到配方）
          if grep -qF 'PACKAGES+=("libbz2")' "$f" && ! grep -qF 'PACKAGES+=("bzip2")' "$f"; then
            echo "ok   libbz2 rename"
          else
            echo "::error::缺 libbz2 修复（仍是 bzip2）→ 请 commit build-bootstraps.sh"; bad=1
          fi

          # 2) 清理 built-packages 目录前必须有 :? 保护
          #    变量为空时会变成 rm -f /*，必须拦。
          #    变量名必须是 TERMUX_BUILT_PACKAGES_DIRECTORY（脚本第 34 行定义的那个），
          #    不能是 _FOR_ARCH 后缀 —— 那个名字全仓库从未定义，
          #    配合 :? 会让 force_rebuild 时直接报
          #    "parameter null or not set" 并把整个构建打死。
          if grep -qF 'rm -f -- "${TERMUX_BUILT_PACKAGES_DIRECTORY:?}/"*' "$f"; then
            echo "ok   built-packages rm guarded"
          else
            echo "::error::缺 TERMUX_BUILT_PACKAGES_DIRECTORY 的 :? 保护"; bad=1
          fi
          # 反向断言：这个 bug 一旦被改回来，这里立刻拦住
          if grep -qF 'TERMUX_BUILT_PACKAGES_DIRECTORY_FOR_ARCH' "$f"; then
            echo "::error::脚本里仍有未定义的 TERMUX_BUILT_PACKAGES_DIRECTORY_FOR_ARCH"; bad=1
          else
            echo "ok   no undefined _FOR_ARCH variable"
          fi

          # 3) 清理 debs 目录前必须有 :? 保护（注意是 rm -f，不是 rm -rf）
          if grep -qF 'rm -f -- "${TERMUX_BUILT_DEBS_DIRECTORY:?}/"*' "$f"; then
            echo "ok   debs rm guarded"
          else
            echo "::error::缺 TERMUX_BUILT_DEBS_DIRECTORY 的 :? 保护"; bad=1
          fi

          # 4) 第二阶段文件按 TERMUX_ARCH 取，不是未定义的 $package_arch
          if grep -qF 'add_termux_bootstrap_second_stage_files "$TERMUX_ARCH"' "$f"; then
            echo "ok   arch var fixed"
          else
            echo "::error::缺 package_arch→TERMUX_ARCH 修复"; bad=1
          fi

          if [ "$bad" -ne 0 ]; then
            echo "::error::build-bootstraps.sh 的修复未进入本次 commit，请 git add + commit + push 后重跑"
            echo '--- 当前脚本里相关行 ---'
            grep -nE 'PACKAGES\+=\("(lib)?bz2"|BUILT_(PACKAGES|DEBS)_DIRECTORY|rm -f --|second_stage_files' "$f" || true
            exit 1
          fi
          echo "BUILD_BOOTSTRAP_FIXES_PRESENT"

      - name: Rewrite package name
        env:
          PKG: ${{ matrix.flavor.package_name }}
        run: |
          set -euo pipefail
          cp scripts/properties.sh scripts/properties.sh.bak

          sed -i "s|^TERMUX_APP__PACKAGE_NAME=.*|TERMUX_APP__PACKAGE_NAME=\"$PKG\"|" scripts/properties.sh

          echo '--- 改动确认（应只剩新包名）---'
          grep -nE '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

          echo
          echo '--- 派生链验证 ---'
          TERMUX_SCRIPTDIR="$PWD" bash -c '
            . ./scripts/properties.sh
            printf "PACKAGE  = %s\nDATA_DIR = %s\nROOTFS   = %s\nPREFIX   = %s\nHOME     = %s\n" \
              "$TERMUX_APP__PACKAGE_NAME" \
              "$TERMUX_APP__DATA_DIR" \
              "$TERMUX__ROOTFS" \
              "$TERMUX__PREFIX" \
              "$TERMUX__HOME"
          '

          echo
          echo '--- 断言 ---'
          TERMUX_SCRIPTDIR="$PWD" bash -c '
            . ./scripts/properties.sh
            want="/data/data/'"$PKG"'/files/usr"
            if [ "$TERMUX__PREFIX" != "$want" ]; then
              echo "::error::PREFIX 不符预期：实际=$TERMUX__PREFIX 期望=$want"
              exit 1
            fi
            case "$TERMUX__PREFIX" in
              *com.termux*) echo "::error::PREFIX 仍含 com.termux"; exit 1 ;;
            esac
            echo "PREFIX_OK = $TERMUX__PREFIX"
          '

      # -----------------------------------------------------------------------
      # 容器权限对齐（本次 CI 失败的真实原因）
      #
      # build-bootstraps.sh 的最后一跳：
      #   L246  zip -r9 "${BOOTSTRAP_TMPDIR}/bootstrap-<arch>.zip" ./*
      #   L249  mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-<arch>.zip" "$TERMUX_PACKAGES_DIRECTORY/"
      # 而 L32 是硬编码：TERMUX_PACKAGES_DIRECTORY="/home/builder/termux-packages"
      # —— 即 run-docker.sh 挂进容器的**宿主仓库根目录**。
      #
      # run-docker.sh 只在宿主 uid 既不是 1001 也不是 0 时才去容器里 chown：
      #   if [ $(id -u) -ne 1001 -a $(id -u) -ne 0 ]; then docker exec ... chown -R $(id -u) ...
      # GitHub runner 的 uid 恰好是 1001，这段被整段跳过。一旦镜像内 builder 的
      # uid 与宿主不一致，宿主仓库根对容器用户就不可写，于是：
      #   mv: cannot create regular file '/home/builder/termux-packages/bootstrap-aarch64.zip': Permission denied
      #
      # 注意 publish_archive 里 mv 失败后 L251 照样 echo "[*] Finished successfully"，
      # 属于**假绿**；真正的兜底是下面 Collect 步骤的 ls 检查（这次就是它拦下来的）。
      #
      # 处理：先按官方 CI 的做法把容器拉起来（packages.yml 里的 Load Docker image），
      # 读出容器默认用户 uid/gid，再把宿主仓库根目录放开写权限。
      # 只对仓库根这一层 chmod、不递归：mv 的目标就是这一层，代价恒定。
      # -----------------------------------------------------------------------
      - name: Load builder container
        run: ./scripts/run-docker.sh true

      # -----------------------------------------------------------------------
      # 给 publish_archive 打补丁：产物落点改到容器家目录
      #
      # 根因（本次 CI 完整日志已证实）：
      #   container user = 1001:1001 | host user = 1001:1001   （uid 相同）
      #   rw=false                                             （挂载本身可写）
      #   workspace after : drwxrwxrwx                         （chmod 777 已生效）
      #   touch: Permission denied                             （容器内进程仍写不进 bind 目录）
      # GitHub Actions 的 docker 对 bind 挂载存在额外的隔离，chown/chmod 都救不了。
      #
      # build-bootstraps.sh L246 的 zip 落在容器内 BOOTSTRAP_TMPDIR(/tmp)，成功；
      # L249 的 mv 目标是 bind 仓库根，失败。所以只要让产物同时留一份到
      # /home/builder（builder 拥有、不是挂载点、可写、且不在 trap 的清理路径里），
      # 再由 workflow 用宿主侧 docker cp 取出即可。docker cp 经 docker daemon，
      # 不受容器→宿主的写权限限制。
      # -----------------------------------------------------------------------
      - name: Patch publish_archive output location
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, sys
          p = "scripts/build-bootstraps.sh"
          s = io.open(p, encoding="utf-8").read()

          old = '\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"'
          new = (
              '\tcp -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "/home/builder/bootstrap-${1}.zip"\n'
              '\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/" \\\n'
              '\t\t|| echo "[WARN] repo root unwritable from container; kept copy at /home/builder/bootstrap-${1}.zip"'
          )

          if old not in s:
              sys.exit("PUBLISH_MV_LINE_NOT_FOUND")
          if s.count(old) != 1:
              sys.exit("PUBLISH_MV_LINE_NOT_UNIQUE: %d" % s.count(old))

          io.open(p, "w", encoding="utf-8", newline="").write(s.replace(old, new))
          print("PATCHED publish_archive")
          PY
          grep -n 'home/builder/bootstrap' scripts/build-bootstraps.sh

      # -----------------------------------------------------------------------
      # 镜像源自动测速（宿主机 + builder 容器内）
      #
      # 为什么需要：编译期真正的下载发生在 **builder 容器内部** —— 每个包的
      # build.sh 里写了源码 URL，大量指向 github.com 或上游站点。只在宿主机配
      # git insteadOf 对容器**完全无效**：容器有自己的 HOME 与 /etc，宿主的
      # ~/.gitconfig 不会被挂进去。
      #
      # 所以分两步：
      #   1) Probe mirrors (host)：测 GitHub 镜像与 apt 源延迟，选出最快的一个，
      #      宿主机配 git insteadOf，并把结果写进 step outputs。
      #   2) Apply mirrors (container)：把同一结果注入 builder 容器
      #      （git 写 builder 用户的 ~/.gitconfig，apt 改容器内 sources.list）。
      #
      # 为什么必须测速而不是写死镜像：不同 runner 出口位置不同，写死的镜像在
      # 部分区域反而比直连慢；镜像本身也会挂。测速失败一律回退直连 ——
      # 不能因为镜像不可用把整轮构建搞挂。
      #
      # 全部 continue-on-error：镜像只是加速手段，失败不该阻断构建。
      # -----------------------------------------------------------------------
      - name: Probe mirrors (host)
        id: mirrors
        continue-on-error: true
        run: |
          set -uo pipefail

          # 输出毫秒整数；请求失败给 999999（保证排在最后）
          probe() {
            local url="$1" t
            t=$(curl -o /dev/null -s -w '%{time_total}' --max-time 6 --connect-timeout 4 "$url" 2>/dev/null || echo 999)
            awk -v x="$t" 'BEGIN{ if (x+0 <= 0) x = 999; printf "%d", x * 1000 }'
          }

          echo '===== GitHub 镜像测速 ====='
          GH_BEST='direct'; GH_BEST_MS=999999
          try_gh() {
            local id="$1" url="$2" ms
            ms=$(probe "$url")
            printf '%-14s %8s ms\n' "$id" "$ms"
            if [ "$ms" -lt "$GH_BEST_MS" ]; then GH_BEST_MS="$ms"; GH_BEST="$id"; fi
          }
          try_gh direct       'https://github.com/termux/termux-packages/raw/master/README.md'
          try_gh ghproxy.net  'https://ghproxy.net/https://github.com/termux/termux-packages/raw/master/README.md'
          try_gh gh-proxy.com 'https://gh-proxy.com/https://github.com/termux/termux-packages/raw/master/README.md'
          try_gh ghfast.top   'https://ghfast.top/https://github.com/termux/termux-packages/raw/master/README.md'
          try_gh kkgithub     'https://raw.kkgithub.com/termux/termux-packages/master/README.md'
          echo "GITHUB_BEST=$GH_BEST (${GH_BEST_MS} ms)"

          echo
          echo '===== apt 源测速 ====='
          APT_BEST=''; APT_BEST_MS=999999
          try_apt() {
            local url="$1" ms
            ms=$(probe "${url}dists/noble/Release")
            printf '%-58s %8s ms\n' "$url" "$ms"
            if [ "$ms" -lt "$APT_BEST_MS" ]; then APT_BEST_MS="$ms"; APT_BEST="$url"; fi
          }
          try_apt 'https://mirrors.tuna.tsinghua.edu.cn/ubuntu/'
          try_apt 'https://mirrors.aliyun.com/ubuntu/'
          try_apt 'https://mirrors.ustc.edu.cn/ubuntu/'
          try_apt 'http://archive.ubuntu.com/ubuntu/'
          # 全部超时则不写 apt 源（保持镜像自带配置）
          if [ "$APT_BEST_MS" -eq 999999 ]; then APT_BEST=''; fi
          echo "APT_BEST=${APT_BEST:-<none>} (${APT_BEST_MS} ms)"

          # 宿主机 git 镜像（作用范围仅限本 workflow 自身的 git 操作）
          case "$GH_BEST" in
            ghproxy.net)  git config --global url."https://ghproxy.net/https://github.com/".insteadOf "https://github.com/" ;;
            gh-proxy.com) git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/" ;;
            ghfast.top)   git config --global url."https://ghfast.top/https://github.com/".insteadOf "https://github.com/" ;;
            kkgithub)     git config --global url."https://github.com/".insteadOf "https://raw.kkgithub.com/" ;;
            *)            echo 'host git: 直连，不配置 insteadOf' ;;
          esac

          {
            echo "gh_best=$GH_BEST"
            echo "apt_best=$APT_BEST"
          } >> "$GITHUB_OUTPUT"
          echo MIRROR_PROBE_DONE

      # -----------------------------------------------------------------------
      # 把测速结果注入 builder 容器
      #
      # 容器信息来自 scripts/run-docker.sh：
      #   : ${CONTAINER_NAME:=termux-package-builder}
      #   CONTAINER_HOME_DIR=/home/builder
      #   __change_builder_uid_gid 会把 builder 的 uid/gid 改成宿主 uid/gid
      # 因此 git 配置必须写进 **builder 用户**的 ~/.gitconfig，不是 root 的。
      #
      # 三个必须这么写的细节：
      #  1) 值通过 docker exec -e 传进去，不用宿主 shell 拼进命令串 ——
      #     否则两层 shell 都会展开，URL 里的字符可能被二次解释。
      #  2) sed 用 | 作分隔符，避免 URL 里的 / 冲突。
      #  3) 不假设有 sudo：runner 上用户有 docker 组，run-docker.sh 的 SUDO 为空。
      # -----------------------------------------------------------------------
      - name: Apply mirrors (container)
        continue-on-error: true
        env:
          GH_BEST: ${{ steps.mirrors.outputs.gh_best }}
          APT_BEST: ${{ steps.mirrors.outputs.apt_best }}
        run: |
          set -uo pipefail
          cid=termux-package-builder

          if docker info >/dev/null 2>&1; then DOCKER='docker'; else DOCKER='sudo docker'; fi

          if ! $DOCKER inspect "$cid" >/dev/null 2>&1; then
            echo '::warning::builder 容器不存在，跳过容器内镜像配置'
            exit 0
          fi

          case "${GH_BEST:-direct}" in
            ghproxy.net)  MIRROR_URL='https://ghproxy.net/https://github.com/' ;;
            gh-proxy.com) MIRROR_URL='https://gh-proxy.com/https://github.com/' ;;
            ghfast.top)   MIRROR_URL='https://ghfast.top/https://github.com/' ;;
            *)            MIRROR_URL='' ;;
          esac

          if [ -n "$MIRROR_URL" ]; then
            $DOCKER exec -u builder -e "MU=$MIRROR_URL" "$cid" bash -lc '
              git config --global "url.$MU.insteadOf" "https://github.com/"
              git config --global --get-regexp "url\." || true
            ' && echo "container git insteadOf -> $MIRROR_URL" \
              || echo '::warning::容器内 git 配置失败（继续，只是不走镜像）'
          else
            echo 'container git: 直连（未配置 insteadOf）'
          fi

          if [ -n "${APT_BEST:-}" ]; then
            $DOCKER exec -u root -e "APT=$APT_BEST" "$cid" bash -lc '
              set -u
              for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
                [ -f "$f" ] && sed -i -E "s|https?://[a-z0-9.]*/ubuntu/?|$APT|g" "$f" 2>/dev/null || true
              done
              echo "container apt -> $APT"
            ' || echo '::warning::容器内 apt 源改写失败（继续）'
          fi

          echo MIRROR_APPLY_DONE

      # -----------------------------------------------------------------------
      # 编译 + 打包（build-bootstraps.sh 依赖 builder 容器内的工具链）
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # 编译 + 打包
      #
      # 这四步一起构成「失败必留日志」的硬保证：
      #   1. Build        —— `set +e` + 显式记录退出码，绝不让 shell 提前退出
      #   2. Collect      —— `if: always()` + `set +e`，无论如何都把日志搬到 out/
      #   3. Emit marker  —— 从日志里提取 `::error::` 行，让失败原因直接出现在
      #                      Actions 摘要里（不必下载 artifact 也能看到一句结论）
      #   4. Upload       —— `if: always()` + `if-no-files-found: warn`
      #
      # 为什么到处 `set +e`：GitHub 的 run 默认 `bash -e`，
      # 任何一行非零退出都会**立即终止整个 step** —— 后面的搬日志代码根本执行不到。
      # 之前就是这个原因导致「failed 但没有任何日志」。
      # -----------------------------------------------------------------------
      - name: Build bootstrap archive
        id: build
        env:
          # 下载重试策略。注意这层 env 只是给下面的 shell 用的，
          # 真正进容器靠 TERMUX_DOCKER_EXEC_EXTRA_ARGS 转发（见下）。
          DL_RETRIES: ${{ inputs.download_retries }}
          DL_DELAY: ${{ inputs.download_retry_delay }}
          DL_MAX: ${{ inputs.download_retry_max }}
          # 构建模式：default / list / custom
          PACKAGE_MODE_INPUT: ${{ inputs.package_mode }}
          # 仅 custom 模式使用的增包清单
          ADD_PACKAGES_INPUT: ${{ inputs.add_packages }}
        run: |
          set +e
          args=(--architectures "${{ matrix.arch }}")

          # ------------------------------------------------------------------
          # 把增包清单接进来。来源优先级：
          #   1. inputs.add_packages 非空 -> 用它（临时试验单个包时方便）
          #   2. 否则读 .github/bootstrap-add-packages.txt（长期清单）
          #
          # build-bootstraps.sh 的 --add 只认主包名，逗号分隔。
          # ------------------------------------------------------------------
          # ------------------------------------------------------------------
          # 增包清单来源（优先级从高到低）：
          #   1. dispatch 的 add_packages 输入（临时覆盖，用于试验单个包）
          #   2. .github/bootstrap-add-packages.txt（长期清单，增删只改这个文件）
          #
          # 用文件而不是 YAML env 的原因：包名是数据不是逻辑。写死在 workflow 里，
          # 增删一个包都要改流水线，且 981 字符的单行串 diff 根本看不出改了啥。
          # ------------------------------------------------------------------
          LIST_FILE=".github/bootstrap-add-packages.txt"
          MODE="${PACKAGE_MODE_INPUT:-list}"
          ADD_LIST=""
          case "$MODE" in
            default)
              echo "==> package_mode=default：纯默认包集，不加任何包"
              ;;
            custom)
              ADD_LIST="${ADD_PACKAGES_INPUT:-}"
              [ -n "$ADD_LIST" ] && echo "==> package_mode=custom：使用手填清单"
              ;;
            list|*)
              if [ -f "$LIST_FILE" ]; then
                ADD_LIST=$(cat "$LIST_FILE")
                echo "==> package_mode=list：从 $LIST_FILE 读取"
              else
                echo "::error::package_mode=list 但 $LIST_FILE 不存在"
                exit 1
              fi
              ;;
          esac

          # ------------------------------------------------------------------
          # 与 preflight 用**同一个**解析器把清单转成主包名。
          #
          # 之前 preflight 和 build 各写一份 sed 去注释 / 去重，
          # 两份实现一旦漂移，就会出现「preflight 校验的这个集合」
          # 和「实际传给 --add 的那个集合」不是同一个 —— 那是很难查的坑。
          # 现在唯一实现是 scripts/resolve-packages.py，两处都调它。
          # ------------------------------------------------------------------
          if [ -n "$ADD_LIST" ]; then
            chmod +x ./scripts/resolve-packages.py 2>/dev/null || true
            if ! ADD_LIST=$(./scripts/resolve-packages.py "$ADD_LIST"); then
              echo "::error::包名解析失败，见上面的 error 行"
              exit 1
            fi
          fi

          if [ -n "$ADD_LIST" ]; then
            n=$(printf '%s' "$ADD_LIST" | tr ',' '\n' | grep -c . || true)
            echo "==> --add $n packages"
            args+=(--add "$ADD_LIST")
          else
            echo "==> --add 未指定，使用默认包集"
          fi

          # ------------------------------------------------------------------
          # run-docker.sh 只转发 CI / DOCKER_EXEC_PID_FILE_PATH 两个变量进容器，
          # 宿主的 export 到不了 build-bootstraps.sh。唯一可用的通道是
          # TERMUX_DOCKER_EXEC_EXTRA_ARGS，它会被原样拼进 docker exec。
          # 这里显式补三个 --env，让 termux_download 的重试参数真正生效。
          # ------------------------------------------------------------------
          export TERMUX_DOCKER_EXEC_EXTRA_ARGS="${TERMUX_DOCKER_EXEC_EXTRA_ARGS:-} --env TERMUX_DOWNLOAD_RETRIES=${DL_RETRIES:-6} --env TERMUX_DOWNLOAD_RETRY_DELAY=${DL_DELAY:-15} --env TERMUX_DOWNLOAD_RETRY_MAX=${DL_MAX:-300}"
          echo "retry policy: ${DL_RETRIES:-6} attempts, base ${DL_DELAY:-15}s, cap ${DL_MAX:-300}s"
          echo "docker exec extra args: ${TERMUX_DOCKER_EXEC_EXTRA_ARGS}"
          # 自检：确认容器里真的能读到（失败也不中断，只是留证据）
          docker exec termux-package-builder env 2>/dev/null | grep -q TERMUX_DOWNLOAD || true

          # 永远加 -f：换包名后旧 deb 缓存里的 ELF 仍烧着 com.termux 前缀
          args+=(-f)

          LOG=/tmp/build-bootstrap.log
          : > "$LOG"

          echo "==> ./scripts/build-bootstraps.sh ${args[*]}"
          # 关键：不用管道 + pipefail（管道 + set -e 会让 tee 之外的部分行为难料），
          # 改成重定向到文件再 tee 回显。退出码由 $? 显式捕获。
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}" > "$LOG" 2>&1
          rc=$?
          cat "$LOG"

          echo "BUILD_EXIT_CODE=$rc"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "log_lines=$(wc -l < "$LOG")" >> "$GITHUB_OUTPUT"

          # 尽力把日志也塞进容器（供 docker cp 兜底），失败不影响主流程
          docker exec -i termux-package-builder tee /home/builder/build-bootstrap.log < "$LOG" >/dev/null 2>&1 || true

          if [ "$rc" -ne 0 ]; then
            echo "::error::build-bootstraps.sh 退出码 $rc（完整日志见 artifact 的 build-${{ matrix.arch }}-${{ matrix.flavor.id }}.log）"
          fi
          exit "$rc"

      # -----------------------------------------------------------------------
      # 搬日志 + 搬产物。**无论上一步成败都执行**。
      #
      # 顺序是刻意的：先搬日志，再搬产物，最后才判定成败。
      # 反过来（先判产物缺失就 exit）会导致失败时日志从未被复制 ——
      # 这个坑已经踩过一次。
      # -----------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set +e
          cid=termux-package-builder
          arch="${{ matrix.arch }}"
          flavor="${{ matrix.flavor.id }}"
          mkdir -p out

          LOGNAME="build-$arch-$flavor.log"

          # ---- 1) 日志：宿主 → out/
          if [ -f /tmp/build-bootstrap.log ]; then
            cp -f /tmp/build-bootstrap.log "out/$LOGNAME"
            echo "LOG host /tmp -> out/$LOGNAME ($(wc -l < "out/$LOGNAME") lines)"
          fi

          # ---- 2) 日志：容器兜底（宿主那份丢了也不至于没证据）
          if [ ! -s "out/$LOGNAME" ]; then
            docker cp "$cid:/home/builder/build-bootstrap.log" "out/$LOGNAME" 2>/dev/null \
              && echo "LOG container /home/builder -> out/$LOGNAME"
          fi

          # ---- 3) 最后一道保险：三个位置都没有，就写一条占位，
          #         保证 artifact 里至少有个文件说明「日志确实没拿到」，
          #         而不是静默地什么都不上传（那会让人误以为步骤没跑）。
          if [ ! -s "out/$LOGNAME" ]; then
            {
              echo "build log missing"
              echo "arch=$arch flavor=$flavor"
              echo "builder container inspect:"
              docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$cid" 2>&1 || true
              echo "container /home/builder:"
              docker exec "$cid" ls -l /home/builder 2>&1 || true
            } > "out/$LOGNAME"
            echo "::warning::三个位置都没有完整日志，已写入占位说明"
          fi

          # ---- 4) 产物
          if docker cp "$cid:/home/builder/bootstrap-$arch.zip" "out/bootstrap-$arch-$flavor.zip" 2>/dev/null; then
            echo "COLLECTED via container:/home/builder"
          elif [ -f "bootstrap-$arch.zip" ]; then
            cp -v "bootstrap-$arch.zip" "out/bootstrap-$arch-$flavor.zip"
            echo "COLLECTED via repo root"
          else
            echo "产物缺失（这是预期内的，如果上一步构建失败）"
          fi

          ls -l out || true

          # ---- 5) 判成败放到最后：日志已经安全落进 out/ 了
          if [ ! -s "out/bootstrap-$arch-$flavor.zip" ]; then
            echo "::error::产物缺失；构建日志已存入 artifact 的 $LOGNAME"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 把日志里的 ::error:: / 关键失败行提取到 Actions 摘要。
      #
      # 目的：不下载 artifact 也能**直接看到一句结论**。
      # 之前的痛点是「failed」之后什么信息都没有，只能反复重跑。
      # -----------------------------------------------------------------------
      - name: Summarize failure
        if: always()
        run: |
          set +e
          LOG="out/build-${{ matrix.arch }}-${{ matrix.flavor.id }}.log"
          [ -f "$LOG" ] || { echo "no log"; exit 0; }

          echo "===== 构建日志摘要 ====="
          echo "行数: $(wc -l < "$LOG")"

          echo "--- 显式错误 ---"
          grep -E '^::error' "$LOG" | head -20 || echo '(无)'

          echo "--- 失败关键词 ---"
          grep -nE 'ERROR|error:|failed|Failed|FAILED|No such file|cannot|Permission denied|未找到|失败' "$LOG" \
            | grep -vE 'error_|_error|errors?\.|--error' | head -30 || echo '(无)'

          echo "--- 最后 40 行 ---"
          tail -40 "$LOG"

          # 让摘要出现在 job summary 里（网页直接可读）
          {
            echo "### bootstrap build: ${{ matrix.flavor.id }} / ${{ matrix.arch }}"
            echo '```'
            echo "exit_code=${{ steps.build.outputs.exit_code }}  log_lines=${{ steps.build.outputs.log_lines }}"
            echo '```'
            echo "#### 错误行"
            echo '```'
            grep -E '^::error|error:|ERROR:|Failed|FAILED' "$LOG" | head -20 || echo '(none)'
            echo '```'
            echo "#### 末尾 30 行"
            echo '```'
            tail -30 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.flavor.id }}-${{ matrix.arch }}
          # 带上 build-*.log：失败时这是唯一能拿到的完整报错
          path: out/*
          if-no-files-found: warn
          retention-days: 30

      # -----------------------------------------------------------------------
      # 发布到 Release —— 「构建成功之后要能把文件传出来」的落地。
      #
      # 为什么需要它（artifact 不够用）：
      #   1. artifact 要登录才能下载，且 30 天过期；
      #   2. artifact 是 zip 包，手机上还得解一层；
      #   3. 想让手机端 App 直接拉取，需要一个稳定可预测的 URL。
      #
      # Release 附件则：公开可下、永久有效、URL 可直接拼出来。
      #
      # tag 策略：`bootstrap-<flavor>-latest` 固定不变，每次**覆盖**同名附件。
      # 不用时间戳 tag 是因为那会让下载 URL 每次都变，App 侧没法写死。
      # 需要历史版本时去 artifact 或者查 Actions 记录。
      # -----------------------------------------------------------------------
      - name: Publish to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ matrix.flavor.id }}
          ARCH: ${{ matrix.arch }}
          PKGNAME: ${{ matrix.flavor.package_name }}
        run: |
          set +e

          # 只有真的产出 zip 才发布：Collect 阶段已保证 out/ 里有日志，
          # 这里必须只挑 bootstrap-*.zip，别把日志也发上去。
          ZIP=$(ls out/bootstrap-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::warning::没有产物 zip，跳过 Release 发布"
            exit 0
          fi
          echo "upload: $ZIP ($(stat -c%s "$ZIP") bytes)"

          TAG="bootstrap-${FLAVOR}-latest"
          TITLE="Bootstrap (${FLAVOR}, ${ARCH}) - latest"
          ASSET="bootstrap-${ARCH}-${FLAVOR}.zip"

          # 统一改名成可预测的名字，方便 App 拼接下载地址
          cp -f "$ZIP" "/tmp/$ASSET"

          # Release 不存在就创建；已存在则复用（并行 matrix 会撞，属正常）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TITLE" \
                 --notes "自动构建：$(date -u '+%Y-%m-%d %H:%M UTC')  |  arch=${ARCH}  |  package=${PKGNAME}  |  编译期前缀 /data/data/${PKGNAME}/files/usr"

          # 覆盖同名附件：--clobber 让重复发布不会失败
          gh release upload "$TAG" "/tmp/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

          # 把下载地址写进摘要，省得再去网页里翻
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "DOWNLOAD_URL=$URL"
          {
            echo "### 下载地址（${FLAVOR} / ${ARCH}）"
            echo ""
            echo "\`\`\`"
            echo "$URL"
            echo "\`\`\`"
            echo ""
            echo "大小：$(stat -c%s "/tmp/$ASSET") 字节"
          } >> "$GITHUB_STEP_SUMMARY"

